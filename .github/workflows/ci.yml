name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python3 scripts/reference-fixtures.py --check
      - run: python3 scripts/life-reference.py --check
      - run: node scripts/ecology-fixtures.mjs
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
